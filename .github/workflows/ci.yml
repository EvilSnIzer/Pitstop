name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        database: [sqlite, postgres]
    services:
      # Matches the major version the Render Blueprint provisions
      # (render.yaml: postgresMajorVersion "16").
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pitstop
          POSTGRES_PASSWORD: pitstop
          POSTGRES_DB: pitstop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitstop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Lint (ruff) and format check (black)
        run: |
          ruff check .
          black --check .

      - name: Django system checks and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: pytest

      # PostgreSQL exercises the concurrency, lease-fencing and budget-reservation
      # paths that SQLite cannot, plus shared-Redis throttling.
      - name: Tests (PostgreSQL + Redis)
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql://pitstop:pitstop@127.0.0.1:5432/pitstop
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest

      - name: Dependency consistency and advisory audit
        run: |
          pip check
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: BFF proxy and transfer handler tests
        run: npm run test:proxy

      - name: Production build (standalone output)
        run: npm run build

      - name: Advisory audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser regressions (Chromium)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Install backend dependencies and migrate
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python manage.py migrate --noinput

      - name: Install frontend dependencies and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_DIRECT_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # CI=1 makes playwright.config.ts start Django and the standalone Next.js
      # server itself. The elevated auth throttle applies to this test server
      # only, because every generated account shares one CI IP address.
      # Failures are re-emitted as a single check annotation so the run summary
      # is readable without opening the raw job log.
      - name: Run browser regressions
        working-directory: frontend
        env:
          CI: "1"
          NEXT_PUBLIC_DIRECT_API_URL: http://127.0.0.1:8000
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "Browser regressions failed (exit $status). Tail of the run:"
              tail -n 60 /tmp/e2e.log
            } | python -c 'import sys, urllib.parse; print("::error::" + urllib.parse.quote(sys.stdin.read()))'
          fi
          exit "$status"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
