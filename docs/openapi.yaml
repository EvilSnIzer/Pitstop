openapi: 3.0.3
info:
  title: AI Car Mechanic API
  version: 1.0.0
  description: Chat-based vehicle troubleshooting with LLM-assisted diagnosis and
    bookings.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/booking/:
    post:
      operationId: v1_booking_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'UUID: reuse for retries of the same body; changed body returns
          409.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/v1/booking/{booking_id}/:
    get:
      operationId: v1_booking_retrieve
      parameters:
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/chat/:
    post:
      operationId: v1_chat_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'UUID: reuse for retries of the same body; changed body returns
          409.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/v1/diagnosis/:
    post:
      operationId: v1_diagnosis_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'UUID: reuse for retries of the same body; changed body returns
          409.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionReferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionReferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionReferenceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /api/v1/media/{media_id}/:
    get:
      operationId: v1_media_retrieve
      parameters:
      - in: path
        name: media_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '302':
          description: No response body
  /api/v1/sessions/:
    get:
      operationId: v1_sessions_retrieve
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - in_progress
          - diagnosed
          - booked
          type: string
          minLength: 1
        description: |-
          * `in_progress` - in_progress
          * `diagnosed` - diagnosed
          * `booked` - booked
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
          description: ''
    post:
      operationId: v1_sessions_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
  /api/v1/sessions/{session_id}/history/:
    get:
      operationId: v1_sessions_history_retrieve
      parameters:
      - in: query
        name: before
        schema:
          type: integer
          minimum: 1
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
          description: ''
  /api/v1/upload/:
    post:
      operationId: v1_upload_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
        required: true
      security:
      - uploadTicket: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
          description: ''
  /api/v1/upload/authorize/:
    post:
      operationId: v1_upload_authorize_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTicketRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadTicketRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadTicketRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
          description: ''
components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - scheduled_at
      - status
    BookingCreateRequest:
      type: object
      properties:
        session_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
      required:
      - scheduled_at
      - session_id
    BookingStatusEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      type: string
      description: |-
        * `pending` - pending
        * `confirmed` - confirmed
        * `cancelled` - cancelled
    ChatRequestRequest:
      type: object
      properties:
        session_id:
          type: integer
        content:
          type: string
          maxLength: 4000
        media_id:
          type: integer
      required:
      - session_id
    ChatResponse:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        session:
          $ref: '#/components/schemas/ChatSession'
      required:
      - message
      - session
    ChatSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ChatSessionStatusEnum'
        diagnosis_ready:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - diagnosis_ready
      - id
      - updated_at
    ChatSessionStatusEnum:
      enum:
      - in_progress
      - diagnosed
      - booked
      type: string
      description: |-
        * `in_progress` - in_progress
        * `diagnosed` - diagnosed
        * `booked` - booked
    Diagnosis:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        summary:
          type: string
        recommended_service:
          type: string
          maxLength: 255
        confidence:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confidence
      - created_at
      - id
      - recommended_service
      - summary
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
          format: uuid
        errors: {}
      required:
      - detail
    FileUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    History:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        diagnosis:
          allOf:
          - $ref: '#/components/schemas/Diagnosis'
          nullable: true
        booking:
          allOf:
          - $ref: '#/components/schemas/Booking'
          nullable: true
        older_cursor:
          type: integer
          nullable: true
      required:
      - booking
      - diagnosis
      - messages
      - older_cursor
      - session
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MediaFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        mime_type:
          type: string
          maxLength: 64
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - mime_type
      - size
      - url
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
        media_url:
          type: string
          nullable: true
          readOnly: true
        media_type:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - media_type
      - media_url
      - role
    MimeTypeEnum:
      enum:
      - image/jpeg
      - image/png
      - image/webp
      - audio/mpeg
      - audio/wav
      - audio/webm
      - audio/ogg
      - video/mp4
      - video/webm
      type: string
      description: |-
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
        * `image/webp` - image/webp
        * `audio/mpeg` - audio/mpeg
        * `audio/wav` - audio/wav
        * `audio/webm` - audio/webm
        * `audio/ogg` - audio/ogg
        * `video/mp4` - video/mp4
        * `video/webm` - video/webm
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
    RoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - user
        * `assistant` - assistant
    SessionList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
      required:
      - count
      - next
      - previous
      - results
    SessionReferenceRequest:
      type: object
      properties:
        session_id:
          type: integer
      required:
      - session_id
    TokenPair:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    UploadTicket:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
      required:
      - expires_in
      - token
    UploadTicketRequestRequest:
      type: object
      properties:
        mime_type:
          $ref: '#/components/schemas/MimeTypeEnum'
        size:
          type: integer
          minimum: 1
      required:
      - mime_type
      - size
    User:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    uploadTicket:
      type: apiKey
      in: header
      name: X-Upload-Token
